# вторая копия на сервере рядом с рабочей: её дашборд подключается к сети рабочей копии,
# и Caddy рабочей копии отдаёт его на поддомене как exp-web:5000. Подключается строкой в .env:
# COMPOSE_FILE=docker-compose.yml:docker-compose.exp.yml
services:
  web:
    networks:
      default:
      main:
        aliases: [exp-web]

networks:
  main:
    external: true
    name: ${MAIN_NETWORK:-steam-health_default}
