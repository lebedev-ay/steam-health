# подключение к базе steam - одно на все сервисы, которые в неё пишут или читают
x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  DB_HOST: postgres
  DB_PORT: 5432

# web и worker: очередь сбора и его глубина
x-app-env: &app-env
  <<: *db-env
  REDIS_URL: redis://redis:6379/0
  COLLECT_REVIEW_DAYS: ${COLLECT_REVIEW_DAYS:-}
  COLLECT_REVIEW_PAGES: ${COLLECT_REVIEW_PAGES:-}
  COLLECT_NEWS_PAGES: ${COLLECT_NEWS_PAGES:-}

# общий блок для всех сервисов Airflow; x- - поле-расширение, compose не считает его сервисом
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: steam-health-airflow:3.3.1
  profiles: ["airflow"]
  user: "${AIRFLOW_UID}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API__BASE_URL: https://airflow.steam-health.ru
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    PYTHONPATH: /opt/project/collector
    TZ: UTC
    MALLOC_ARENA_MAX: "2"
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: "3"
    AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: "3"
    DBT_LOG_PATH: /tmp/dbt-logs
    DBT_TARGET_PATH: /tmp/dbt-target
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./collector:/opt/project/collector:ro
    - ./dbt:/opt/project/dbt
  depends_on: &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: steam-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: steam-redis
    mem_limit: 128m
    restart: unless-stopped

  # разовый прогон миграций перед стартом web/worker: образ тот же, но db/migration/ в него не копируется - домонтируем отдельно
  migrate:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: steam-health:latest
    command: python collector/migrate.py
    environment: *db-env
    volumes:
      - ./collector:/app/collector
      - ./db:/app/db
    depends_on:
      postgres:
        condition: service_healthy

  # разовая сборка витрин: после migrate и до web/worker
  dbt:
    image: steam-health:latest
    command: dbt run --project-dir dbt --profiles-dir dbt
    environment: *db-env
    volumes:
      - ./dbt:/app/dbt
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: steam-health:latest
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      <<: *app-env
      # подпись сессии входа; без него вход и сбор из дашборда выключены
      SECRET_KEY: ${SECRET_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
    volumes:
      - ./web:/app
      - ./collector:/app/collector
      - ./dbt:/app/dbt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      dbt:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: steam-health:latest
    command: celery -A tasks worker --loglevel=info --concurrency=1
    environment:
      <<: *app-env
      # LLM-разметка запускается руками внутри worker: docker compose exec worker python -m llm.label ...
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PRICE_INPUT: ${LLM_PRICE_INPUT:-}
      LLM_PRICE_OUTPUT: ${LLM_PRICE_OUTPUT:-}
      LLM_PRICE_INPUT_CACHED: ${LLM_PRICE_INPUT_CACHED:-}
    volumes:
      - ./web:/app
      - ./collector:/app/collector
      - ./dbt:/app/dbt
      - ./llm:/app/llm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      dbt:
        condition: service_completed_successfully
    restart: unless-stopped

  # метабаза Airflow: отдельный инстанс, чтобы падение steam-postgres не роняло сам Airflow
  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres
    mem_limit: 128m
    command: >
      postgres
      -c shared_buffers=32MB
      -c max_connections=30
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
    profiles: ["airflow"]
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - airflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  # разовая подготовка: миграция метабазы, пользователь, права на папки
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        /entrypoint airflow version
        mkdir -p /opt/airflow/logs /opt/airflow/dags
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/logs /opt/airflow/dags
        ls -ln /opt/airflow
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}

  # интерфейс, REST API и приём статусов от задач
  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    mem_limit: 350m
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      <<: *airflow-common-env
      AIRFLOW__API__WORKERS: "1"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # планировщик: решает, что запускать, и сам запускает задачи (LocalExecutor)
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    mem_limit: 500m
    command: scheduler
    environment:
      # доступы к базе steam нужны только здесь: задачи выполняются в scheduler
      <<: [*airflow-common-env, *db-env]
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy

  # читает файлы DAG и складывает разобранные графы в метабазу
  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    mem_limit: 250m
    command: dag-processor
    environment:
      <<: *airflow-common-env
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "60"
      AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "60"
      AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  airflow-pgdata: