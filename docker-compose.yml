# общий блок для всех сервисов Airflow; x- - поле-расширение, compose не считает его сервисом
x-airflow-common: &airflow-common
  image: apache/airflow:3.3.1-python3.12
  profiles: ["airflow"]
  user: "${AIRFLOW_UID}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    TZ: UTC
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
  depends_on: &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy


services:
  postgres:
    image: postgres:16
    container_name: steam-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: steam-redis
    mem_limit: 128m
    restart: unless-stopped

  # разовый прогон миграций перед стартом web/worker: образ тот же, но db/migration/ в него не копируется - домонтируем отдельно
  migrate:
    build:
      context: .
      dockerfile: web/Dockerfile
    command: python collector/migrate.py
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - ./collector:/app/collector
      - ./db:/app/db
    depends_on:
      postgres:
        condition: service_healthy

  # разовая сборка витрин: после migrate и до web/worker
  dbt:
    build:
      context: .
      dockerfile: web/Dockerfile
    command: dbt run --project-dir dbt --profiles-dir dbt
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - ./dbt:/app/dbt
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      COLLECT_TOKEN: ${COLLECT_TOKEN:-}
      DEFAULT_APP_ID: ${DEFAULT_APP_ID:-}
      COLLECT_REVIEW_DAYS: ${COLLECT_REVIEW_DAYS:-}
      COLLECT_REVIEW_PAGES: ${COLLECT_REVIEW_PAGES:-}
      COLLECT_NEWS_PAGES: ${COLLECT_NEWS_PAGES:-}
    volumes:
      - ./web:/app
      - ./collector:/app/collector
      - ./dbt:/app/dbt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      dbt:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: web/Dockerfile
    command: celery -A tasks worker --loglevel=info --concurrency=1
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      COLLECT_REVIEW_DAYS: ${COLLECT_REVIEW_DAYS:-}
      COLLECT_REVIEW_PAGES: ${COLLECT_REVIEW_PAGES:-}
      COLLECT_NEWS_PAGES: ${COLLECT_NEWS_PAGES:-}
    volumes:
      - ./web:/app
      - ./collector:/app/collector
      - ./dbt:/app/dbt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      dbt:
        condition: service_completed_successfully
    restart: unless-stopped

 # метабаза Airflow: отдельный инстанс, чтобы падение steam-postgres не роняло сам Airflow
  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres
    profiles: ["airflow"]
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - airflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  # разовая подготовка: миграция метабазы, пользователь, права на папки
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        /entrypoint airflow version
        mkdir -p /opt/airflow/logs /opt/airflow/dags
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/logs /opt/airflow/dags
        ls -ln /opt/airflow
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}

volumes:
  pgdata:
  airflow-pgdata:
