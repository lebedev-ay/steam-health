
services:
  postgres:
    image: postgres:16
    container_name: steam-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: steam-redis
    mem_limit: 128m
    restart: unless-stopped

  # разовый прогон миграций перед стартом web/worker: образ тот же,
  # но db/migration/ в него не копируется - домонтируем отдельно
  migrate:
    build:
      context: .
      dockerfile: web/Dockerfile
    command: python collector/migrate.py
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - ./collector:/app/collector
      - ./db:/app/db
    depends_on:
      postgres:
        condition: service_healthy

  # разовая сборка витрин: после migrate и до web/worker
  dbt:
    build:
      context: .
      dockerfile: web/Dockerfile
    command: dbt run --project-dir dbt --profiles-dir dbt
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - ./dbt:/app/dbt
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      COLLECT_TOKEN: ${COLLECT_TOKEN:-}
    volumes:
      - ./web:/app
      - ./collector:/app/collector
      - ./dbt:/app/dbt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      dbt:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: web/Dockerfile
    command: celery -A tasks worker --loglevel=info --concurrency=1
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./web:/app
      - ./collector:/app/collector
      - ./dbt:/app/dbt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      dbt:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata: