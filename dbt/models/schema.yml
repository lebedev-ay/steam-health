version: 2

models:
  - name: dim_game_current
    description: >
      Текущая версия каждой игры, одна строка на app_id — срез dim_game без SCD2-истории и без заглушки Unknown,
      с разработчиками, издателями и жанрами через запятую.
    columns:
      - name: game_sk
        data_tests:
          - unique
          - not_null
      - name: app_id
        data_tests:
          - unique
          - not_null

  - name: review_daily
    description: >
      Дневной агрегат отзывов по игре, одна строка на (app_id, day).
    columns:
      - name: app_id
        data_tests:
          - not_null
      - name: day
        data_tests:
          - not_null

  - name: review_segment
    description: >
      Доля позитива в разрезах аудитории, одна строка на (app_id, dimension, segment): наигранные часы, язык,
      способ получения игры, ранний доступ, ответ разработчика.
    columns:
      - name: dimension
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['playtime', 'language', 'purchase', 'early_access', 'dev_response']
      - name: segment
        data_tests:
          - not_null

  - name: llm_config_active
    description: >
      Активная конфигурация LLM-разметки, одна строка. Задаётся переменными llm_active_model и llm_active_prompt_hash в dbt_project.yml.

  - name: review_labeled
    description: >
      Размеченные отзывы, одна строка на (recommendation_id, llm_config_sk): статусы labeled и no_opinion, размечен текущий текст, текст не короче llm_min_length.
    columns:
      - name: labeling_sk
        data_tests:
          - unique
          - not_null

  - name: review_labeling_daily
    description: >
      Знаменатели дня для LLM-разметки, одна строка на (app_id, day, llm_config_sk): всего отзывов, из них содержательных, из них размеченных.
    columns:
      - name: app_id
        data_tests:
          - not_null
      - name: day
        data_tests:
          - not_null
      - name: llm_config_sk
        data_tests:
          - not_null

  - name: review_aspect_daily
    description: >
      Подаспекты по дням, одна строка на (app_id, day, llm_config_sk, aspect_id): число размеченных отзывов с аспектом, из них с «+», «-», «±», и знаменатели дня.
      overall_impression - только у отзывов, где он единственный аспект.
    columns:
      - name: aspect_id
        data_tests:
          - not_null
      - name: category_id
        data_tests:
          - not_null

  - name: review_aspect_tag
    description: >
      Теги размеченных отзывов после правила overall_impression, одна строка на (labeling_sk, aspect_id). Несколько other в отзыве сворачиваются в одну строку, разные знаки - в «±».

  - name: review_category_daily
    description: >
      Категории по дням, одна строка на (app_id, day, llm_config_sk, category_id): число разных размеченных отзывов с хотя бы одним аспектом категории,
      из них по знаку отзыва в категории (одинаковые знаки - этот знак, разные - «±»), и знаменатели дня.
    columns:
      - name: category_id
        data_tests:
          - not_null

  - name: llm_verdict_config_active
    description: >
      Активная конфигурация выводов по переломам, одна строка. Задаётся переменными llm_verdict_model и llm_verdict_prompt_hash в dbt_project.yml.

  - name: change_point_verdict_current
    description: >
      Текущий вывод по точке перелома, одна строка на (app_id, change_date): самый свежий вывод активной конфигурации генерации
      по активной конфигурации разметки, независимо от checks_passed. Дашборд показывает текст только при checks_passed.
    columns:
      - name: verdict_sk
        data_tests:
          - unique
          - not_null

