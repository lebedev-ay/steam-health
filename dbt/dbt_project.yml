name: steam_health
version: '1.0'

profile: steam_health

model-paths: ['models']
target-path: 'target'
clean-targets: ['target', 'dbt_packages']

vars:
  # порог для dbt/tests/unknown_member_ratio.sql
  unknown_member_max_ratio: 0.05
  # LLM-разметка: отзыв короче порога не содержательный - в знаменатель «среди отзывов с текстом» не входит (llm/label.py, --min-length)
  llm_min_length: 20
  # активная конфигурация разметки для dbt/models/llm_config_active.sql: модель и начало хэша промпта (core.dim_llm_config)
  llm_active_model: deepseek-flash
  llm_active_prompt_hash: 0ac4fe63
  # активная конфигурация выводов по переломам для dbt/models/llm_verdict_config_active.sql: модель и начало хэша промпта вывода
  llm_verdict_model: deepseek-flash
  llm_verdict_prompt_hash: af261708
  # активная конфигурация разметки новостей для dbt/models/news_label_current.sql. Пустой хэш - разметка не выбрана,
  # представление пустое, дашборд считает важность событий по-старому
  llm_news_model: deepseek-flash
  llm_news_prompt_hash: '4924afbb'
